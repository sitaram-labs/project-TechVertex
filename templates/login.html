<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Surplus-to-Shelter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2.25rem;
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            background: #0f172a;
            padding: 0.25rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .auth-tab-btn {
            flex: 1;
            padding: 0.55rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.88rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .auth-tab-btn.active {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Minimal Landing Navigation Header -->
    <nav class="navbar">
        <a href="/" class="brand-logo">
            <div class="brand-icon">🌱</div>
            <span>SurplusToShelter</span>
        </a>
    </nav>

    <!-- Main Auth Container -->
    <main class="auth-container">
        <div class="auth-card">

            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2 style="font-size:1.4rem; font-weight:700; color:white;">
                    Account Sign In
                </h2>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">
                    Sign in or create account to enter the food rescue workspace
                </p>
            </div>

            <!-- Auth Form Tab Switcher -->
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
            </div>

            <!-- Form 1: Clean Sign In -->
            <form id="form-login" onsubmit="handleAuthLogin(event)" style="display:flex; flex-direction:column; gap:1rem;">
                <div class="form-group">
                    <label class="form-label">User Email Address *</label>
                    <input type="email" id="login-email" placeholder="name@domain.com" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Location / City *</label>
                    <input type="text" id="login-location" placeholder="e.g. Jaipur, Rajasthan, India" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Account Role *</label>
                    <select id="login-role" class="form-control">
                        <option value="donor">🍲 Food Donor / Restaurant</option>
                        <option value="shelter">🏠 NGO / Shelter</option>
                        <option value="driver">🚚 Volunteer Driver</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.7rem; margin-top:0.3rem;">
                    Sign In & Access Workspace &rarr;
                </button>
            </form>

            <!-- Form 2: Clean Register New Account -->
            <form id="form-register" onsubmit="handleAuthRegister(event)" style="display:none; flex-direction:column; gap:1rem;">
                <div class="form-group">
                    <label class="form-label">Organization / User Name *</label>
                    <input type="text" id="reg-name" placeholder="e.g. Green Earth NGO or Central Kitchen" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" id="reg-email" placeholder="name@domain.com" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Street Address & Location *</label>
                    <input type="text" id="reg-address" placeholder="e.g. Johari Bazar, Jaipur, Rajasthan, India" required class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Account Role *</label>
                    <select id="reg-role" class="form-control">
                        <option value="donor">🍲 Food Donor / Restaurant</option>
                        <option value="shelter">🏠 NGO / Shelter</option>
                        <option value="driver">🚚 Volunteer Driver</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.7rem; margin-top:0.3rem;">
                    Register Account & Access &rarr;
                </button>
            </form>

        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <a href="/" class="brand-logo" style="display:inline-flex;">
                    <div class="brand-icon">🌱</div>
                    <span>SurplusToShelter</span>
                </a>
                <p class="footer-tagline">Connecting corporate dining and restaurants with local shelters & NGOs.</p>
            </div>
            <div class="footer-bottom" style="grid-column: 1 / -1;">
                <p>&copy; 2026 Surplus-to-Shelter System • TechVertex Team</p>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        function switchAuthTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                formLogin.style.display = 'flex';
                formRegister.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                formLogin.style.display = 'none';
                formRegister.style.display = 'flex';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        async function handleAuthLogin(event) {
            if (event && event.preventDefault) event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const location = document.getElementById('login-location').value;
            const role = document.getElementById('login-role').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role, address: location })
                }).then(r => r.json());

                if (res.success && res.user) {
                    if (location) res.user.address = location;
                    saveUserProfile(res.user);
                    showToast('🎉 Login Successful!', `Welcome back, ${escapeHtml(res.user.name)}! Redirecting to workspace...`, 'emerald');
                    setTimeout(() => {
                        window.location.href = '/portal';
                    }, 800);
                }
            } catch (err) {
                showToast('⚠️ Error', 'Login failed. Please check credentials.', 'rose');
            }
        }

        async function handleAuthRegister(event) {
            event.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const name = document.getElementById('reg-name').value;
            const address = document.getElementById('reg-address').value;
            const role = document.getElementById('reg-role').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role, name, address, lat: 26.9124, lng: 75.7873 })
                }).then(r => r.json());

                if (res.success && res.user) {
                    saveUserProfile(res.user);
                    showToast('🎉 Account Registered!', `Welcome, ${escapeHtml(res.user.name)}! Redirecting to workspace...`, 'purple');
                    setTimeout(() => {
                        window.location.href = '/portal';
                    }, 800);
                } else {
                    showToast('⚠️ Registration Error', res.error || 'Registration failed.', 'rose');
                }
            } catch (err) {
                showToast('⚠️ Error', 'Failed to register account.', 'rose');
            }
        }
    </script>
</body>
</html>
